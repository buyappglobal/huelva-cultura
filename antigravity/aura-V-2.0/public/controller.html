<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - Directo Aura</title>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --panel-bg: #121216;
      --accent-blue: #00f2fe;
      --accent-purple: #9d4edd;
      --accent-orange: #ff9e00;
      --text-white: #ffffff;
      --text-muted: #787880;
      --border-color: #22222a;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    input[type="text"], textarea {
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      color: white;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent-blue);
    }

    .btn-group {
      display: grid;
      grid-template-cols: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    button {
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background-color: var(--text-white);
      color: var(--bg-dark);
    }

    .btn-primary:hover {
      background-color: #e2e2e8;
    }

    .btn-orange {
      background-color: var(--accent-orange);
      color: black;
    }

    .btn-orange:hover {
      background-color: #ffa61a;
    }

    .btn-danger {
      background-color: #ff3333;
      color: white;
    }

    .btn-danger:hover {
      background-color: #ff5555;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #4cd964;
    }

    .status-dot.active {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(76, 217, 100, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0); }
    }

    .preset-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 5px;
    }

    .preset-tag {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .preset-tag:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Control Remoto - Directo Aura</h1>

    <div class="status-indicator">
      <div class="status-dot active"></div>
      <span>Panel sincronizado localmente con OBS (vía localStorage)</span>
    </div>

    <!-- Notification Toast Banner -->
    <div id="toast" style="display: none; background: rgba(0, 242, 254, 0.1); border: 1px solid var(--accent-blue); color: var(--accent-blue); padding: 12px; border-radius: 10px; font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; animation: pulse 2s infinite;">
      ¡Acción enviada al overlay!
    </div>

    <div class="form-group">
      <label>🛠️ Estado del Desarrollo (Qué estás haciendo)</label>
      <input type="text" id="statusText" placeholder="Ej: Ajustando CSS de transiciones...">
      <div class="preset-list">
        <span class="preset-tag" onclick="setPresetStatus('Ajustando el layout y CSS de la V2')">Ajustando CSS V2</span>
        <span class="preset-tag" onclick="setPresetStatus('Optimizando la carga de archivos multimedia')">Optimización Carga</span>
        <span class="preset-tag" onclick="setPresetStatus('Cazando un bug crítico en la cola de reproducción')">Cazando Bug</span>
        <span class="preset-tag" onclick="setPresetStatus('Refactorizando llamadas de la API de sesión')">Refactor API</span>
      </div>
    </div>

    <div class="form-group">
      <label>📋 Diario de Cambios (Últimas novedades del directo)</label>
      <textarea id="changelogText" rows="4" placeholder="Ej: v2.1.2 - Añadido panel de ofertas express&#10;v2.1.1 - Ajustado retardo de HLS"></textarea>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="updateOverlay()">Actualizar Overlay</button>
      <button class="btn-orange" onclick="toggleScreen('mantenimiento')">Pantalla Despliegue / Corte</button>
    </div>

    <div class="btn-group">
      <button class="btn-primary" style="background-color: #3b82f6; color: white;" onclick="toggleScreen('none')">Limpiar Pantalla (Modo Normal)</button>
      <button class="btn-danger" onclick="resetOverlay()">Restaurar Todo</button>
    </div>
  </div>

  <script>
    function showToast(message, color = '#00f2fe', bgColor = 'rgba(0, 242, 254, 0.1)') {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.style.color = color;
      toast.style.borderColor = color;
      toast.style.background = bgColor;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    async function syncWithServer(statusText, changelog, screenType) {
      try {
        await fetch('/api/admin/directo-overlay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ statusText, changelog, screenType })
        });
      } catch (e) {
        console.error("Error syncing with server:", e);
      }
    }

    function setPresetStatus(text) {
      document.getElementById('statusText').value = text;
      updateOverlay();
    }

    async function updateOverlay() {
      const statusText = document.getElementById('statusText').value;
      const changelog = document.getElementById('changelogText').value;
      
      localStorage.setItem('obs_live_status', statusText);
      localStorage.setItem('obs_live_changelog', changelog);
      localStorage.setItem('obs_live_update_trigger', Date.now());
      
      const screenType = localStorage.getItem('obs_live_screen') || 'none';
      await syncWithServer(statusText, changelog, screenType);
      showToast('¡Overlay actualizado en la nube!');
    }

    async function toggleScreen(screenType) {
      localStorage.setItem('obs_live_screen', screenType);
      localStorage.setItem('obs_live_update_trigger', Date.now());
      
      const statusText = document.getElementById('statusText').value;
      const changelog = document.getElementById('changelogText').value;
      await syncWithServer(statusText, changelog, screenType);
      
      if (screenType === 'mantenimiento') {
        showToast('¡Pantalla de Corte/Despliegue activada!', '#ff9e00', 'rgba(255, 158, 0, 0.1)');
      } else {
        showToast('¡Pantalla limpiada (Modo Normal)!', '#3b82f6', 'rgba(59, 130, 246, 0.1)');
      }
    }

    async function resetOverlay() {
      document.getElementById('statusText').value = '';
      document.getElementById('changelogText').value = '';
      localStorage.setItem('obs_live_status', '');
      localStorage.setItem('obs_live_changelog', '');
      localStorage.setItem('obs_live_screen', 'none');
      localStorage.setItem('obs_live_update_trigger', Date.now());
      
      await syncWithServer('', '', 'none');
      showToast('¡Valores restaurados!', '#ff3333', 'rgba(255, 51, 51, 0.1)');
    }

    // Cargar valores existentes al iniciar
    window.onload = async function() {
      try {
        const res = await fetch('/api/admin/directo-overlay');
        if (res.ok) {
          const data = await res.json();
          document.getElementById('statusText').value = data.statusText || '';
          document.getElementById('changelogText').value = data.changelog || '';
        }
      } catch (e) {
        // Fallback to local storage
        document.getElementById('statusText').value = localStorage.getItem('obs_live_status') || '';
        document.getElementById('changelogText').value = localStorage.getItem('obs_live_changelog') || '';
      }
    };
  </script>
</body>
</html>
