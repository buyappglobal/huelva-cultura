<!doctype html>
<html lang="es">
  <head>
    <script>
      window.addEventListener('error', function(e) {
        var isAssetError = (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) || 
                           (e && e.message && (e.message.indexOf('module script') !== -1 || e.message.indexOf('MIME type') !== -1 || e.message.indexOf('Loading chunk') !== -1));
        if (isAssetError) {
          if (!sessionStorage.getItem('aura_stale_reloaded')) {
            sessionStorage.setItem('aura_stale_reloaded', '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var i = 0; i < names.length; i++) caches.delete(names[i]);
              });
            }
            setTimeout(function() {
              window.location.reload(true);
            }, 200);
          }
        }
      }, true);
    </script>
